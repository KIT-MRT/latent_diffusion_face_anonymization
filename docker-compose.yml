services:
  sd-api-gpu0:
    image: ldfa
    container_name: sd-api-gpu0
    ports:
    - 7860:7860
    environment:
      CUDA_VISIBLE_DEVICES: '0'
    shm_size: 16g
    volumes: []
    entrypoint: python3 webui.py --listen --api --xformers
    restart: unless-stopped
